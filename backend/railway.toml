[build]
builder = "NIXPACKS"
buildCommand = "chmod +x ./mvnw && ./mvnw clean package -DskipTests || mvn clean package -DskipTests"

[deploy]
startCommand = "java -Dserver.port=$PORT -jar target/northwind-management-system-1.0.0.jar --spring.profiles.active=prod"
healthcheckPath = "/actuator/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
